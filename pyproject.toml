[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "analista-futbol"
dynamic = ["version"]
description = "Análisis de datos de fútbol: lee un partido desde el video (TV, capturadora o archivo) y analiza eventos y tracking abiertos (StatsBomb, SkillCorner)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "jazaineam1" }]
keywords = ["futbol", "soccer", "football", "analytics", "tracking", "computer-vision", "xg", "statsbomb", "skillcorner"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Natural Language :: Spanish",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.2",
  "opencv-python>=4.8",
  "requests>=2.28",
  "flask>=2.3",
  "imageio-ffmpeg>=0.4.9",
]

[project.optional-dependencies]
video = ["ultralytics>=8.3", "mss>=9.0"]
graficos = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7", "ruff>=0.4"]
todo = ["ultralytics>=8.3", "mss>=9.0", "matplotlib>=3.7"]

[project.scripts]
analista = "analista.cli:main"

[project.urls]
Homepage = "https://jazaineam1.github.io/analista-futbol/"
Repository = "https://github.com/jazaineam1/analista-futbol"
Issues = "https://github.com/jazaineam1/analista-futbol/issues"

[tool.setuptools.dynamic]
version = { attr = "analista.__version__" }

[tool.setuptools.packages.find]
include = ["analista*"]

[tool.setuptools.package-data]
analista = ["modelos/*.json", "panel/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E731", "E741"]
